<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#E11D48"/>
<title>Maintenance — PropFlow KE</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/tailwind.css"/>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body data-page="maintenance" data-title="Maintenance">
<template id="header-actions"><button class="btn btn-brand" onclick="openTicket()">+ New request</button></template>
<div id="page">

<div class="mb-5"><h2 class="text-2xl font-bold">Maintenance</h2><p class="text-gray-500 text-sm mt-0.5">Track repairs from first report to resolved, tied to the exact house or room.</p></div>
<div class="mb-4"><div id="tabs" class="tabs"><span class="tab on">All</span></div></div>
<div id="tickets-list" class="card divide-line overflow-hidden"><div class="p-4"><div class="skel h-14"></div></div><div class="p-4"><div class="skel h-14"></div></div></div>
<div id="ticket-modal" class="modal" aria-hidden="true">
  <form id="ticket-form" class="sheet max-w-md" novalidate>
    <div class="flex justify-between items-center px-6 py-4 border-b border-[var(--line)]"><h2 class="text-lg font-semibold">New maintenance request</h2><button type="button" onclick="PF.closeModal('ticket-modal')" class="text-gray-400 text-2xl leading-none" aria-label="Close">&times;</button></div>
    <div class="p-6 space-y-4">
      <div><label class="lbl" for="tk-title">What needs fixing? *</label><input id="tk-title" class="auth-input" placeholder="Leaking kitchen tap" autocomplete="off"/></div>
      <div><label class="lbl" for="tk-where">Where</label><select id="tk-where" class="auth-input bg-white"></select></div>
      <div><label class="lbl" for="tk-desc">Details</label><textarea id="tk-desc" rows="3" class="auth-input" placeholder="Optional notes for the plumber / fundi"></textarea></div>
      <div><label class="lbl" for="tk-priority">Priority</label><select id="tk-priority" class="auth-input bg-white"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
    </div>
    <div class="flex gap-3 px-6 pb-6"><button type="button" class="btn flex-1" onclick="PF.closeModal('ticket-modal')">Cancel</button><button type="submit" class="btn btn-brand flex-1">Log request</button></div>
  </form>
</div>

</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/billing.js"></script>
<script src="/js/store.js"></script>
<script src="/js/payments.js"></script>
<script src="/js/ai-automation.js"></script>
<script src="/js/tenancy.js"></script>
<script src="/js/pdf-ledger.js"></script>
<script src="/js/export.js"></script>
<script src="/js/receipts.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/maintenance.js"></script>
</body>
</html>
